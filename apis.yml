name: ResourceWise
description: >-
  ResourceWise is a market intelligence company for sustainable commodities,
  delivering data, analytics, pricing benchmarks, forecasts, and consulting
  across the forest products, pulp and paper, biofuels, and chemicals markets.
  It was formed by unifying established industry brands including Tecnon
  OrbiChem, Wood Resources International, Fisher International, Forest2Market,
  Prima Markets, and Chemical Intelligence under the ResourceWise name. Its
  subscription platforms include ChemEdge360, FisherSolve, Forestat Global,
  OrbiChem360, Prima CarbonZero, Recycled Fiber 360, SilvaStat360, and
  WoodMarket Prices. The company is backed by Battery Ventures. No public API
  or developer portal is currently published; access is delivered through its
  SaaS platform logins.
